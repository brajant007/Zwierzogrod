<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FLEET CORE — Logowanie</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          base: '#09090b', panel: '#131316', border: '#2e2e32',
          accent: '#FF5722', gold: '#F0A500', ok: '#22C55E', crit: '#E11D2E', muted: '#9BA1A6',
        },
        fontFamily: {
          head: ['"Barlow Condensed"', 'sans-serif'],
          body: ['"Barlow"', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body { background: #09090b; overscroll-behavior-y: contain; }
  body { -webkit-tap-highlight-color: transparent; user-select: none; }
  .safe-top { padding-top: env(safe-area-inset-top); }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
  .tile { touch-action: manipulation; transition: transform 0.1s, border-color 0.15s; }
  .tile:active { transform: scale(0.97); }
  .tile[data-selected="true"] { border-color: #FF5722; background: rgba(255,87,34,0.08); }

  .key { touch-action: manipulation; transition: transform 0.08s, background 0.1s; }
  .key:active { transform: scale(0.94); background: #232326; }

  .dot { transition: background 0.15s, transform 0.15s; }
  .dot[data-filled="true"] { background: #FF5722; transform: scale(1.15); }

  .shake { animation: shake 0.4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-8px); }
    40%, 80% { transform: translateX(8px); }
  }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } }

  input:focus, button:focus-visible { outline: 2px solid #FF5722; outline-offset: 2px; }
</style>
</head>
<body class="font-body text-zinc-50 min-h-screen flex flex-col">

<!-- ============ STEP 1: WYBÓR KIEROWCY ============ -->
<section id="step-select" class="flex-1 flex flex-col safe-top safe-bottom px-5 pt-8">
  <div class="mb-6">
    <div class="w-8 h-1.5 bg-accent mb-3"></div>
    <h1 class="font-head text-3xl tracking-wide leading-none">KTO PROWADZI?</h1>
    <p class="text-sm text-muted mt-1">Wybierz swoje nazwisko z listy</p>
  </div>

  <div id="driver-list" class="flex-1 overflow-y-auto space-y-3 pb-4">
    <!-- injected -->
  </div>

  <div class="text-center text-[11px] text-muted font-mono pb-4" id="select-status">ładowanie kierowców…</div>
</section>

<!-- ============ STEP 2: PIN ============ -->
<section id="step-pin" class="flex-1 hidden flex-col safe-top safe-bottom px-5 pt-8">
  <button id="back-to-select" class="text-sm text-muted font-mono mb-6 self-start border border-border px-3 py-1.5">← wstecz</button>

  <div class="mb-8 text-center">
    <div class="font-head text-2xl tracking-wide" id="pin-driver-name">—</div>
    <p class="text-sm text-muted mt-1">Wpisz 4-cyfrowy PIN</p>
  </div>

  <div class="flex justify-center gap-4 mb-10" id="pin-dots">
    <span class="dot w-4 h-4 rounded-full bg-border" data-filled="false"></span>
    <span class="dot w-4 h-4 rounded-full bg-border" data-filled="false"></span>
    <span class="dot w-4 h-4 rounded-full bg-border" data-filled="false"></span>
    <span class="dot w-4 h-4 rounded-full bg-border" data-filled="false"></span>
  </div>

  <div class="grid grid-cols-3 gap-3 max-w-xs mx-auto w-full" id="keypad">
    <!-- injected 1-9, 0, backspace -->
  </div>

  <div class="flex-1"></div>
  <div class="text-center text-[11px] text-crit font-mono pb-4 h-4" id="pin-error"></div>
</section>

<script>
/* =========================================================
   KONFIGURACJA
   ========================================================= */
const firebaseConfig = {
  apiKey: "TWOJ_API_KEY",
  authDomain: "TWOJ_PROJEKT.firebaseapp.com",
  databaseURL: "https://TWOJ_PROJEKT-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "TWOJ_PROJEKT",
  storageBucket: "TWOJ_PROJEKT.appspot.com",
};

// Kierowcy + PINy. Docelowo PINy trzymane jako hash w /drivers/{id}/pin_hash w Firebase,
// nie w kodzie źródłowym — na start (żeby appka działała offline-first) trzymamy lokalnie.
const DEMO_DRIVERS = [
  { id: 'driver_01', name: 'Jan Kowalski', truck_id: 'truck_01', truck_plate: 'PO 1234A', pin: '1234' },
  { id: 'driver_02', name: 'Adam Nowicki', truck_id: 'truck_02', truck_plate: 'PO 9911B', pin: '2222' },
  { id: 'driver_03', name: 'Piotr Zieliński', truck_id: 'truck_03', truck_plate: 'PO 4477C', pin: '3333' },
];

let firebaseReady = false;
let db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  firebaseReady = true;
} catch (e) {
  console.warn('Firebase niepodłączony — lista kierowców z danych demo.', e);
}

let DRIVERS = DEMO_DRIVERS;
let selectedDriver = null;
let pinBuffer = '';

/* =========================================================
   ŁADOWANIE LISTY KIEROWCÓW
   ========================================================= */
function loadDrivers() {
  if (firebaseReady) {
    db.ref('/drivers').once('value').then(snap => {
      const val = snap.val();
      if (val) {
        DRIVERS = Object.entries(val).map(([id, d]) => ({
          id, name: d.name, truck_id: d.assigned_truck_id || '', truck_plate: d.truck_plate || '', pin: d.pin || null,
        }));
      }
      renderDriverList();
    }).catch(() => renderDriverList());
  } else {
    renderDriverList();
  }
}

function renderDriverList() {
  const el = document.getElementById('driver-list');
  el.innerHTML = DRIVERS.map(d => `
    <button class="tile w-full bg-panel border border-border p-5 flex items-center gap-4 text-left" data-driver-id="${d.id}">
      <div class="w-12 h-12 flex-shrink-0 bg-base border border-border flex items-center justify-center font-head text-lg text-accent">
        ${initials(d.name)}
      </div>
      <div class="flex-1 min-w-0">
        <div class="font-head text-xl tracking-wide leading-tight">${d.name}</div>
        <div class="text-xs text-muted font-mono mt-0.5">${d.truck_plate || d.truck_id}</div>
      </div>
    </button>
  `).join('');
  document.getElementById('select-status').textContent = firebaseReady ? '' : 'tryb demo — brak połączenia z Firebase';

  el.querySelectorAll('[data-driver-id]').forEach(btn => {
    btn.addEventListener('click', () => selectDriver(btn.dataset.driverId));
  });
}

function initials(name) {
  return name.split(' ').map(p => p[0]).slice(0,2).join('').toUpperCase();
}

/* =========================================================
   WYBÓR KIEROWCY -> EKRAN PIN
   ========================================================= */
function selectDriver(id) {
  selectedDriver = DRIVERS.find(d => d.id === id);
  if (!selectedDriver) return;
  pinBuffer = '';
  updatePinDots();
  document.getElementById('pin-driver-name').textContent = selectedDriver.name;
  document.getElementById('step-select').classList.add('hidden');
  document.getElementById('step-select').classList.remove('flex');
  document.getElementById('step-pin').classList.remove('hidden');
  document.getElementById('step-pin').classList.add('flex');
  document.getElementById('pin-error').textContent = '';
}

document.getElementById('back-to-select').addEventListener('click', () => {
  document.getElementById('step-pin').classList.add('hidden');
  document.getElementById('step-pin').classList.remove('flex');
  document.getElementById('step-select').classList.remove('hidden');
  document.getElementById('step-select').classList.add('flex');
});

/* =========================================================
   KEYPAD
   ========================================================= */
function buildKeypad() {
  const el = document.getElementById('keypad');
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  el.innerHTML = keys.map(k => {
    if (k === '') return `<div></div>`;
    return `<button class="key h-16 border border-border font-head text-2xl tracking-wide" data-key="${k}">${k}</button>`;
  }).join('');
  el.querySelectorAll('[data-key]').forEach(btn => {
    btn.addEventListener('click', () => handleKey(btn.dataset.key));
  });
}
buildKeypad();

function handleKey(k) {
  if (k === '⌫') {
    pinBuffer = pinBuffer.slice(0, -1);
    updatePinDots();
    return;
  }
  if (pinBuffer.length >= 4) return;
  pinBuffer += k;
  updatePinDots();
  if (pinBuffer.length === 4) {
    setTimeout(checkPin, 150);
  }
}

function updatePinDots() {
  document.querySelectorAll('#pin-dots .dot').forEach((dot, i) => {
    dot.dataset.filled = i < pinBuffer.length ? 'true' : 'false';
  });
}

function checkPin() {
  const expected = selectedDriver.pin;
  if (expected && pinBuffer !== expected) {
    document.getElementById('pin-error').textContent = 'Nieprawidłowy PIN — spróbuj ponownie';
    document.getElementById('pin-dots').classList.add('shake');
    setTimeout(() => {
      document.getElementById('pin-dots').classList.remove('shake');
      pinBuffer = '';
      updatePinDots();
    }, 400);
    return;
  }
  // sukces (albo brak zdefiniowanego PIN-u w danych — wpuszczamy, ale logujemy ostrzeżenie)
  if (!expected) console.warn('Kierowca bez ustawionego PIN-u — do uzupełnienia w /drivers w Firebase.');
  localStorage.setItem('fc_driver_id', selectedDriver.id);
  localStorage.setItem('fc_truck_id', selectedDriver.truck_id);
  window.location.href = 'driver.html';
}

loadDrivers();
</script>
</body>
</html>
